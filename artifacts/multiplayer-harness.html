<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frontier Nightmare Multiplayer Harness</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050507;
        color: #ffe0a0;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      main {
        height: 100%;
        display: grid;
        grid-template-rows: 36px 1fr;
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 12px;
        border-bottom: 1px solid rgba(255, 224, 166, 0.2);
        background: #08080b;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .frames {
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 6px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 1px solid rgba(255, 224, 166, 0.28);
        background: #050507;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span>Two independent frontend clients</span>
        <span>Same backend authority at ws://127.0.0.1:8787</span>
      </header>
      <section class="frames">
        <iframe title="client one" src="http://127.0.0.1:5173/?client=one"></iframe>
        <iframe title="client two" src="http://127.0.0.1:5173/?client=two"></iframe>
      </section>
    </main>
  </body>
</html>
